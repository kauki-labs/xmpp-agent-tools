[package]
name = "xmpp-agent"
version = "0.1.0"
description = "Connect a human on XMPP to a coding agent over ACP (DM mode)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "xmpp_agent"

[[bin]]
name = "xmpp-agent"
path = "src/main.rs"

# The scripted ACP agent of xmpp-agent-acp, built here so the end-to-end tests have its path; it is not part of the API.
[[bin]]
name = "loop-fake-agent"
path = "../xmpp-agent-acp/tests/support/fake_agent.rs"
test = false

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
xmpp-agent-acp = { path = "../xmpp-agent-acp" }
xmpp-agent-approvals = { path = "../xmpp-agent-approvals" }
xmpp-agent-client = { path = "../xmpp-agent-client" }
xmpp-agent-common = { path = "../xmpp-agent-common" }
xmpp-agent-xmpp = { path = "../xmpp-agent-xmpp" }

[dev-dependencies]
rstest.workspace = true
