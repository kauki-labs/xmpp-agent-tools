[package]
name = "xmpp-agent-rooms"
version = "0.1.0"
description = "Room tools for agents, as a CLI and an MCP server, over a rights service"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "xmpp_agent_rooms"

[[bin]]
name = "xmpp-agent-rooms"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
ureq.workspace = true
xmpp-agent-common = { path = "../xmpp-agent-common" }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
rstest.workspace = true
tiny_http.workspace = true
