# Everything that runs on a pull request. `Merge gate` is the only required check on main (a ruleset requires that exact name):
# it is green when every other job is success or skipped (a job that did not apply to the change) and red for anything else.
# Add new check jobs here and list them in the gate's `needs`.
name: PR

on:
  pull_request:
    branches: [main]
  merge_group:

# No permissions by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      workflows: ${{ steps.classify.outputs.workflows }}
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # An unknown base (a manual run) classifies as "everything changed".
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # No rename detection (a renamed file lists both names) and no path quoting (a quoted name does not end in `.rs`).
            git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" | python3 ci/changes.py
          else
            : | python3 ci/changes.py
          fi
          # The classifier writes to $GITHUB_OUTPUT.

  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The owner adds the Nix binary cache step here later (the sandy repo uses cache-nix-action, pinned by SHA).
      # - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      - name: Unit tests with branch coverage (floor 90%)
        run: nix build -L .#checks.x86_64-linux.py-tests

  mutation:
    name: mutation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The owner adds the Nix binary cache step here later (the sandy repo uses cache-nix-action, pinned by SHA).
      # - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      - name: Every mutation must fail the tests
        run: nix build -L .#checks.x86_64-linux.mutation

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The owner adds the Nix binary cache step here later (the sandy repo uses cache-nix-action, pinned by SHA).
      # - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      - name: Format
        run: nix build -L .#checks.x86_64-linux.fmt
      - name: Clippy
        run: nix build -L .#checks.x86_64-linux.clippy
      - name: Unit tests
        run: nix build -L .#checks.x86_64-linux.test

  scrub:
    name: scrub
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The owner adds the Nix binary cache step here later (the sandy repo uses cache-nix-action, pinned by SHA).
      # - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      - name: No internal names in a public repository
        run: nix build -L .#checks.x86_64-linux.scrub

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The owner adds the Nix binary cache step here later (the sandy repo uses cache-nix-action, pinned by SHA).
      # - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      - name: actionlint and zizmor
        run: nix build -L .#checks.x86_64-linux.workflows

  merge-gate:
    name: Merge gate
    needs: [changes, tests, mutation, rust, scrub, workflows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Green only if every job is success or skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 ci/merge_gate.py
